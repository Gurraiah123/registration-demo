---
- name: Deploy Application into EKS cluster
  hosts: appserver
  gather_facts: no
  become: yes

  tasks:

    - name: Create Kubernetes directory
      file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"

    - name: Create Kubernetes manifests directory
      file:
        path: /home/ec2-user/k8s
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy Kubernetes deployment manifest
      copy:
        src: "{{ playbook_dir }}/../k8s/deployment.yaml"
        dest: /home/ec2-user/k8s/deployment.yaml
        owner: ec2-user
        group: ec2-user
        mode: "0644"

    - name: Copy Kubernetes service manifest
      copy:
        src: "{{ playbook_dir }}/../k8s/service.yaml"
        dest: /home/ec2-user/k8s/service.yaml
        owner: ec2-user
        group: ec2-user
        mode: "0644"

    - name: Check kubeconfig file exists
      stat:
        path: /home/ec2-user/.kube/config
      register: kubeconfig_stat

    - name: Copy kubeconfig file to target if missing
      copy:
        src: "{{ playbook_dir }}/kubeconfig"
        dest: /home/ec2-user/.kube/config
        owner: ec2-user
        group: ec2-user
        mode: "0600"
      when: not kubeconfig_stat.stat.exists

    - name: Apply Kubernetes deployment
      command: kubectl apply -f /home/ec2-user/k8s/
      become_user: ec2-user
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Check deployment rollout
      command: kubectl rollout status deployment/registration-demo --timeout=300s
      become_user: ec2-user
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config

    - name: Get Kubernetes services
      command: kubectl get services
      become_user: ec2-user
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config
