
---
- name: Deploy Application into EKS cluster
  hosts: appserver
  gather_facts: no
  become: yes

  tasks:

    - name: Create Kubernetes directory
      ansible.builtin.file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"

    - name: Create Kubernetes manifests directory
      ansible.builtin.file:
        path: /home/ec2-user/k8s
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy Kubernetes deployment manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/k8s_deployment.yaml"
        dest: /home/ec2-user/k8s/k8s_deployment.yaml
        owner: ec2-user
        group: ec2-user
        mode: "0644"

    - name: Generate EKS kubeconfig
      ansible.builtin.command:
        cmd: >
          aws eks update-kubeconfig
          --region us-east-1
          --name registration
          --kubeconfig /home/ec2-user/.kube/config
      become_user: ec2-user
      environment:
        HOME: /home/ec2-user

    - name: Verify EKS connection
      ansible.builtin.command:
        cmd: kubectl get nodes
      become_user: ec2-user
      environment:
        HOME: /home/ec2-user
        KUBECONFIG: /home/ec2-user/.kube/config
      register: eks_nodes
      changed_when: false

    - name: Display EKS nodes
      ansible.builtin.debug:
        var: eks_nodes.stdout_lines

    - name: Apply Kubernetes deployment
      ansible.builtin.command:
        cmd: kubectl apply -f /home/ec2-user/k8s/
      become_user: ec2-user
      environment:
        HOME: /home/ec2-user
        KUBECONFIG: /home/ec2-user/.kube/config
