apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-demo
  labels:
    app: registration-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registration-demo
  template:
    metadata:
      labels:
        app: registration-demo
    spec:
      containers:
        - name: registration-container
          image: guru0114/registration-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
spec:
  type: LoadBalancer
  selector:
    app: registration-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
