---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-apps
  labels:
    app: mc-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mc-app
  template:
    metadata:
      labels:
        app: mc-app
    spec:
      containers:
        - name: mc-app
          image: guru0114/k8s:1
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: mc-app
spec:
  type: LoadBalancer
  selector:
    app: mc-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP