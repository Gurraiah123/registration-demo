<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration successful</title>
    <style>
        body { font-family: system-ui, Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 32px 16px; color: #1f2937; }
        .card { max-width: 480px; margin: 40px auto; background: #fff; padding: 32px; border-radius: 12px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
        .tick { font-size: 48px; color: #16a34a; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<div class="card">
    <div class="tick">&#10004;</div>
    <h1>Registration successful</h1>
    <p th:if="${name != null}">Welcome, <strong th:text="${name}">User</strong>! Your account has been created.</p>
    <p th:unless="${name != null}">Your account has been created.</p>
    <p><a th:href="@{/users}">View registered users</a> &middot; <a th:href="@{/register}">Register another</a></p>
</div>
</body>
</html>
